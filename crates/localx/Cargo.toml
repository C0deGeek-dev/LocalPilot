[package]
name = "localx"
version = "6.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "localx"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
localpilot-config = { path = "../localpilot-config" }
localpilot-dist = { path = "../localpilot-dist" }
localpilot-stack = { path = "../localpilot-stack" }

[target.'cfg(windows)'.dependencies]
# Keeps setup's own standard streams from the model server it starts.
localpilot-winsec = { path = "../localpilot-winsec" }

[dev-dependencies]
tempfile = { workspace = true }
