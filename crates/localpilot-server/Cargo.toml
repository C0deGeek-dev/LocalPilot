[package]
name = "localpilot-server"
version = "3.3.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
localpilot-rpc = { path = "../localpilot-rpc" }
# The session registry hosts `SessionRuntime`s (harness), keys them by
# `SessionId` (core), and resumes them from the durable event log (store).
localpilot-core = { path = "../localpilot-core" }
localpilot-harness = { path = "../localpilot-harness" }
localpilot-store = { path = "../localpilot-store" }
# The swarm layer holds the shared task graph and mutates it under the swarm
# registry's own write lock.
localpilot-taskgraph = { path = "../localpilot-taskgraph" }
# The tool-facing swarm view implements `localpilot-tools`' `SwarmPeers`, which
# is where the messaging tool reaches the registry from.
localpilot-tools = { path = "../localpilot-tools" }
# `FuturesUnordered`, so the plan driver can refill on each worker completion
# rather than waiting for a whole wave. An existing pinned workspace dep.
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the pair-convergence candidate digest: two peers must agree on the
# same digest for the same canonical artifact bytes. An existing pinned workspace
# dep, added here for the convergence protocol.
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# `net` (additive over the workspace features) is required for the local IPC
# transport: `tokio::net::UnixListener` on Unix and
# `tokio::net::windows::named_pipe` on Windows. The rest of the tokio features
# this crate uses (io-util for AsyncRead/AsyncWrite, time for retry backoff,
# sync for the accept-side mutex and the registry's RwLock/per-session Mutex,
# macros/rt for tests) are already enabled by the workspace default and unify
# in.
tokio = { workspace = true, features = ["net"] }
# The per-session host publishes each turn's `CancellationToken` (from
# `tokio-util`, an existing pinned workspace dep) so out-of-band cancel reaches an
# in-flight turn without the runtime mutex. Kept internal — not in any public
# signature.
tokio-util = { workspace = true }

[dev-dependencies]
# A test session factory mirrors how the harness tests build a `SessionRuntime`:
# a `FakeProvider` (llm), builtin tools, a bypass permission engine + sandbox
# workspace, a recovery engine, over a `tempfile` temp-dir store.
# (`localpilot-core`, `localpilot-store`, `serde_json`, and `tokio-util` are
# already normal dependencies, which integration tests can use as-is.)
localpilot-llm = { path = "../localpilot-llm" }
localpilot-recovery = { path = "../localpilot-recovery" }
localpilot-sandbox = { path = "../localpilot-sandbox" }
# The host tests register a first-party test tool that blocks inside `invoke` to
# open a deterministic mid-turn window; implementing the `Tool` trait needs the
# same `#[async_trait]` the trait is declared with — an existing pinned
# workspace dep, added here for tests only.
async-trait = { workspace = true }
tempfile = { workspace = true }
# `test-util` gives paused-time control so the convergence driver's slot-timeout
# and cancellation paths are tested deterministically without real waiting.
tokio = { workspace = true, features = [
    "net",
    "macros",
    "rt-multi-thread",
    "time",
    "test-util",
] }
