name: ci

on:
  push:
    branches: [main]
  pull_request:

# Full debuginfo across 74 test binaries makes the target dir outgrow the
# hosted ubuntu runner's free disk; the runner then wedges mid-run and dies
# as "lost communication" with no logs. Line tables keep panic file:line in
# failures at a fraction of the size. (The test profile inherits dev.)
#
# Incremental compilation is the other multi-gigabyte consumer of that disk,
# and it buys nothing on a CI runner: every job is a cold tree, so the
# incremental caches are written, never reused, and then thrown away with the
# VM. Off everywhere.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A green run takes ~5 minutes warm; the cap turns a starved runner
    # ("lost communication", no logs) into a fast, attributable failure.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # The hosted ubuntu image ships ~25 GB of preinstalled toolchains this
      # build never touches, and the documented wedge here is the target dir
      # outgrowing the free disk (see the workflow env note): the runner stops
      # being able to write, loses communication, and the job dies at its
      # ceiling with the log still on the dead VM. Reclaim the dead weight
      # before anything builds. Everything removed is restorable by the image,
      # nothing here is a build input, and the tool cache that holds the
      # toolchain we *do* use is left alone.
      - if: runner.os == 'Linux'
        name: reclaim runner disk
        shell: bash
        run: |
          echo "=== free disk before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "=== free disk after ==="; df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Prebuilt nextest binary; install-action does not build from source, so the
      # pinned 1.82 toolchain does not constrain the runner version.
      - uses: taiki-e/install-action@nextest
      # The hosted-ubuntu VM freezes under parallel link/test storms (see the
      # nextest step's history note). The first containment only wrapped that
      # one step — but every later cargo step (doctests, the vendored
      # LocalMind workspace suite, the TUI feature build) can raise the same
      # storm, and the vendored workspace grew sharply on 2026-07-23, which
      # is when wedges became deterministic. Contain the whole job instead:
      # cap build parallelism for every subsequent cargo invocation, and run
      # one job-lifetime low-memory watchdog that kills a storm while the VM
      # can still report it.
      - if: runner.os == 'Linux'
        name: linux resource containment (build-jobs cap + memory watchdog)
        shell: bash
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          # `capped <cmd>` runs a command with a hard cgroup memory ceiling so a
          # runaway process tree is OOM-killed inside the cgroup instead of
          # thrashing the whole VM into the unresponsive state that loses the
          # log. A step cannot inherit another step's cgroup move, so this is a
          # helper every subsequent step can call rather than a one-off. Wholly
          # best-effort: an image without the memory controller delegated runs
          # the command uncapped rather than failing.
          sudo tee /usr/local/bin/capped >/dev/null <<'CAPPED'
          #!/usr/bin/env bash
          cg=/sys/fs/cgroup/localpilot-ci
          if sudo mkdir -p "$cg" 2>/dev/null \
             && echo 11G | sudo tee "$cg/memory.max" >/dev/null 2>&1 \
             && echo 0 | sudo tee "$cg/memory.swap.max" >/dev/null 2>&1 \
             && echo $$ | sudo tee "$cg/cgroup.procs" >/dev/null 2>&1; then
            :
          else
            echo "capped: memory ceiling unavailable — running uncapped" >&2
          fi
          exec "$@"
          CAPPED
          sudo chmod +x /usr/local/bin/capped
          ( while true; do
              avail=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
              if [ "${avail:-9999999}" -lt 1000000 ]; then
                echo "watchdog: MemAvailable ${avail}kB — killing the build/test storm"
                pkill -9 -f 'nextest|rustc|\bld\b|cc1|corpus' || true
              fi
              sleep 5
            done ) >/dev/null 2>&1 &
          disown
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Disk headroom before and after the heaviest step: the failure mode this
      # guards is the runner filling its disk and dying without uploading logs,
      # so the evidence has to be printed while the machine is still healthy.
      - run: df -h .
        shell: bash
      # Unit + integration tests via nextest. Fallback without nextest installed:
      # `cargo test --workspace`. nextest does not run doctests, so run those too.
      #
      # On hosted ubuntu this step has wedged to the job ceiling — with its log
      # lost — on every run since the 2026-07-08 runner-agent rollout
      # (2.335.1 → 2.336.0), while windows/macos and a local Linux run of the
      # same commit pass in minutes. Contain it on Linux: output goes to a
      # file (a leaked child can hold a file handle without holding the
      # step's output pipe open, so the step can end) and a hard timeout kills
      # a wedged nextest with its progress preserved; the tail step then names
      # exactly what was running.
      - if: runner.os != 'Linux'
        run: cargo nextest run --workspace
      # Since the 2026-07-08 runner rollout, this phase freezes the whole
      # hosted-ubuntu VM: neither a bash `timeout -k` (SIGKILL) nor a
      # step-level timeout fires — the runner worker itself stops making
      # progress until the job ceiling kills the job from the outside, logs
      # included (the job then ends at exactly 55 minutes: the 45-minute
      # ceiling plus GitHub's grace for an unresponsive runner). The same
      # commit passes the full suite in ~9 minutes on windows/macos and on a
      # local Linux machine, so the trigger is resource pressure on the
      # 4-vCPU/16 GB VM.
      #
      # Capping `--build-jobs` alone did not stop it, because the storm is not
      # only compilation: `localpilot-harness`'s first-party corpus tests each
      # spawn a nested `cargo test` (tests/first_party.rs), and nextest
      # defaults to one test thread per core — so four nested cargo builds can
      # run on top of the main link storm, and the vendored LocalMind crates
      # (which grew sharply on 2026-07-23, when the wedges became
      # deterministic) build in this same workspace.
      #
      # Bounded concurrency, a cgroup memory ceiling, and reclaiming ~25 GB of
      # runner disk each failed to move it, so the constraint is not one of the
      # things guessed at from outside. What survives a frozen VM is not the
      # log — it dies with the runner — but the *step boundaries*, which the
      # jobs API reports either way. So the phase runs as steps that each answer
      # one question, and the step with no completion timestamp names the
      # culprit.
      #
      # That split already ruled out the two loudest suspects: building and
      # linking all ~74 test binaries completes in under two minutes, and the
      # nested-cargo corpus is not reached. The wedge is in *test execution*, so
      # execution is now one step per package: the first step without a
      # completion timestamp is the package that freezes the runner.
      - if: runner.os == 'Linux'
        name: linux — build test binaries
        timeout-minutes: 20
        shell: bash
        run: |
          df -h /
          capped cargo nextest run --workspace --no-run --build-jobs 2
          df -h /
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot'
        timeout-minutes: 8
        run: capped cargo nextest run -p localpilot --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-config'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-config --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-core'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-core --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-llm'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-llm --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-localmind'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-localmind --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-mcp'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-mcp --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-patchgen'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-patchgen --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-quota'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-quota --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-recovery'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-recovery --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-render'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-render --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-research'
        timeout-minutes: 8
        run: capped cargo nextest run -p localpilot-research --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-rpc'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-rpc --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-sandbox'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-sandbox --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-selfreview'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-selfreview --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-skills'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-skills --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-store'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-store --test-threads 2
      # The one package whose tests spawn real child processes — `run_shell`
      # (including a deliberately hung command) and the background-process
      # registry. It is also the only package that has wedged the runner since
      # execution was split per package, so it gets the strictest containment:
      #
      #   --test-threads 1  no two process-spawning tests are ever live at once;
      #   setsid            children land in their own session rather than
      #                     sharing the runner's, so a leaked one cannot signal
      #                     or wait on it;
      #   output to a file  a leaked child inherits the command's stdout, and a
      #                     child holding the *step's* pipe keeps it open after
      #                     the command exits — the runner then waits on a step
      #                     that already finished (this is why the original
      #                     unsplit step redirected too);
      #   stdin from null   nothing can block reading a console that isn't there.
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-tools'
        timeout-minutes: 12
        shell: bash
        run: |
          status=0
          setsid capped cargo nextest run -p localpilot-tools --test-threads 1 \
            > nextest-tools.log 2>&1 < /dev/null || status=$?
          tail -n 200 nextest-tools.log || true
          exit "$status"
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-tui'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-tui --test-threads 2
      - if: runner.os == 'Linux'
        name: 'linux — tests: localpilot-verify'
        timeout-minutes: 6
        run: capped cargo nextest run -p localpilot-verify --test-threads 2
      - if: runner.os == 'Linux'
        run: df -h /
      - id: nextest-linux
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        name: linux — run the harness corpus serially
        shell: bash
        run: |
          ( while true; do
              avail=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
              if [ "${avail:-9999999}" -lt 1000000 ]; then
                echo "watchdog: MemAvailable ${avail}kB — killing the build/test storm" >> nextest-run.log
                pkill -9 -f 'nextest|rustc|\bld\b|cc1|corpus' || true
              fi
              sleep 5
            done ) >/dev/null 2>&1 & WATCHDOG=$!
          status=0
          timeout -k 30s 15m capped cargo nextest run -p localpilot-harness --build-jobs 2 --test-threads 1 > nextest-run.log 2>&1 || status=$?
          kill "$WATCHDOG" 2>/dev/null || true
          df -h /
          exit "$status"
      - if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          tail -n 300 nextest-run.log || true
          echo "=== peak memory inside the capped cgroup ==="
          cat /sys/fs/cgroup/localpilot-nextest/memory.peak 2>/dev/null || echo "(no cgroup cap this run)"
          free -h || true
          echo "=== process table (oldest last) ==="
          ps -ef --sort=start_time | tail -n 30 || true
          echo "=== kernel hung-task / I/O traces ==="
          sudo dmesg | tail -n 150 || true
      - if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-wedge-log
          path: nextest-run.log
          retention-days: 7
      - if: runner.os == 'Linux' && steps.nextest-linux.outcome != 'success'
        shell: bash
        run: echo "::error::linux nextest step did not succeed (wedge or failures — see nextest-wedge-log)"; exit 1
      - run: df -h .
        shell: bash
      # Per-step ceilings so a wedge names its step instead of eating the
      # 45-minute job ceiling with its log lost. Generous vs green-run times
      # (each step is minutes warm); only a storm trips them.
      - run: cargo test --doc --workspace
        timeout-minutes: 15
      - run: cargo check --workspace
        timeout-minutes: 10
      # The vendored LocalMind engine is its own workspace; run its suite so a
      # broken vendored test fails this build and the pinned commit's behavior
      # stays verified on every OS. This is a second full-workspace build —
      # the heaviest post-suite step, covered by the job-wide Linux
      # containment above.
      - run: cargo nextest run --workspace --manifest-path external/localmind/Cargo.toml
        timeout-minutes: 20
      - run: cargo test --doc --workspace --manifest-path external/localmind/Cargo.toml
        timeout-minutes: 15
      # The interactive TUI (`chat`) is behind an opt-in feature; lint, build, and
      # test it here so the terminal driver — including the inline scrollback-commit
      # fidelity tests — is covered on every OS.
      - run: cargo clippy -p localpilot --features tui,learning --all-targets -- -D warnings
        timeout-minutes: 15
      - run: cargo build -p localpilot --features tui,learning
        timeout-minutes: 15
      # Run the binary's own unit tests under the TUI feature (the inline-driver
      # scrollback-commit tests live here). Scoped to the bin: the integration tests
      # under tests/ are not feature-dependent and already run in the workspace step.
      - run: cargo nextest run -p localpilot --features tui,learning --bin localpilot
        timeout-minutes: 15

  coverage:
    name: coverage (line floor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # Same disk reclamation as the test job — instrumented builds are the
      # largest consumer of the runner's free space in this workflow.
      - name: reclaim runner disk
        shell: bash
        run: |
          echo "=== free disk before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "=== free disk after ==="; df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: df -h .
      # Line-coverage floor over the workspace. The floor is a ratchet: set
      # from the measured baseline, raised deliberately, never lowered to
      # admit a regression.
      #
      # One `--workspace` invocation is exactly the shape that wedges the
      # hosted-ubuntu VM (see the test job's execution steps): the test job
      # only went green once each package ran as its own nextest invocation.
      # Apply the same isolation here — `--no-report` accumulates each
      # package's profile data into the shared profile dir, and the floor is
      # then evaluated once over the merged whole-workspace report, so the
      # ratchet keeps its meaning. The corpus package runs serially because
      # its tests each spawn a nested `cargo test`.
      - id: cov-nextest
        continue-on-error: true
        timeout-minutes: 35
        shell: bash
        run: |
          ( while true; do
              avail=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
              if [ "${avail:-9999999}" -lt 1000000 ]; then
                echo "watchdog: MemAvailable ${avail}kB — killing the build/test storm" >> coverage-run.log
                pkill -9 -f 'nextest|rustc|\bld\b|cc1|corpus' || true
              fi
              sleep 5
            done ) >/dev/null 2>&1 & WATCHDOG=$!
          status=0
          cargo llvm-cov clean --workspace
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort); do
            # Serial for the two packages that spawn real child processes: the
            # corpus tests each run a nested `cargo test`, and localpilot-tools
            # drives `run_shell` and the background-process registry (the
            # package that wedged the plain test job).
            threads=2
            case "$pkg" in localpilot-harness | localpilot-tools) threads=1 ;; esac
            echo "=== coverage: $pkg (--test-threads $threads) ==="
            timeout -k 30s 10m cargo llvm-cov nextest --no-report -p "$pkg" \
              --build-jobs 2 --test-threads "$threads" >> coverage-run.log 2>&1 || status=$?
          done
          kill "$WATCHDOG" 2>/dev/null || true
          exit "$status"
      - name: coverage floor over the merged report
        if: steps.cov-nextest.outcome == 'success'
        run: cargo llvm-cov report --fail-under-lines 75
      - if: always()
        run: |
          tail -n 300 coverage-run.log || true
          echo "=== peak memory inside the capped cgroup ==="
          cat /sys/fs/cgroup/localpilot-coverage/memory.peak 2>/dev/null || echo "(no cgroup cap this run)"
          free -h || true
          echo "=== process table (oldest last) ==="
          ps -ef --sort=start_time | tail -n 30 || true
          echo "=== kernel hung-task / I/O traces ==="
          sudo dmesg | tail -n 150 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-wedge-log
          path: coverage-run.log
          retention-days: 7
      - if: steps.cov-nextest.outcome != 'success'
        run: echo "::error::coverage nextest step did not succeed (wedge or failures — see coverage-wedge-log)"; exit 1
      - run: df -h .
      - run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 14

  supply-chain:
    name: supply-chain (advisories, licenses, bans, unused deps)
    runs-on: ubuntu-latest
    # Blocking before the v1 release (docs/14 §4, docs/09 release checklist).
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete
      - run: cargo deny check
      - run: cargo audit
      - run: cargo machete

  lockfile-guard:
    name: lockfile guard (no unexplained Cargo.lock drift)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # A Cargo.lock change without a matching manifest change means a
      # dependency moved without a deliberate decision (docs/13 §1: pins are
      # exact; bumps are their own commit). Surface it as a failure so the
      # change is explained, not silent.
      - name: fail on lockfile-only dependency drift
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "$base"...HEAD)"
          if echo "$changed" | grep -qx "Cargo.lock"; then
            if ! echo "$changed" | grep -q "Cargo.toml"; then
              echo "Cargo.lock changed without any Cargo.toml change."
              echo "Dependency moves must come from a manifest decision."
              exit 1
            fi
          fi

  install-smoke:
    name: clean-environment install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - uses: Swatinem/rust-cache@v2
      # Install exactly what a user would get, from the locked graph, into a
      # fresh root; then prove the produced binary runs.
      - run: cargo install --path crates/localpilot-cli --locked --root "$RUNNER_TEMP/install-smoke"
      - run: '"$RUNNER_TEMP/install-smoke/bin/localpilot" --help'

  doc-drift:
    name: doc drift guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No retired PowerShell/.NET stack described as current
        shell: bash
        run: |
          # The v2.0.0 native-Rust rewrite retired the PowerShell module and .NET
          # TUI. Docs may reference them only as tagged history, never as current.
          hits=$(grep -rniE '(Install-Module|\bPester\b|PSScriptAnalyzer|\.psm1|\.psd1)' \
                   docs README.md --include='*.md' 2>/dev/null \
                 | grep -viE 'retired|removed|history|migrat|1\.x|legacy|no longer' || true)
          if [ -n "$hits" ]; then
            echo "::error::a doc describes the retired PowerShell/.NET stack as current:"
            echo "$hits"
            exit 1
          fi
          echo "no retired-stack language in docs."
