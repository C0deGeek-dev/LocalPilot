# Workspace nextest configuration.
#
# A stalled test on a 4-core hosted CI runner starves it until GitHub kills
# the whole job ("the hosted runner lost communication with the server") and
# the logs vanish with it — the failure is unattributable. Flag a test as
# slow after 60 seconds and terminate it after 5 minutes so a hang fails
# loudly, by name, in the report instead. Proposal validation fixtures repeatedly
# hash real installed toolchains and can exceed a minute in debug builds; keep
# their independent crash boundaries separate and cap concurrent heavy fixtures.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
proposal-validation = { max-threads = 2 }
mesh-conformance = { max-threads = 2 }

[[profile.default.overrides]]
filter = '(package(localpilot-selfimprove) and (test(execution::tests::) or test(promotion::tests::))) or (package(localpilot-patchgen) and test(validation::promotion::tests::process_crash_)) or (package(localpilot) and (test(explicit_execution_then_separate_) or test(selfimprove_validation_)))'
test-group = 'proposal-validation'
# These fixtures take about two minutes alone on a machine with many
# toolchains installed, and longer under a full parallel run.
slow-timeout = { period = "60s", terminate-after = 10 }

# The mesh conformance shards each drive a whole Python runner over a slice of
# the fixtures. Four shards running beside the rest of a full run exceeded the
# 5-minute ceiling, so the list is cut into eight and at most two run at a
# time. The delegate's conformance subset is the same work.
[[profile.default.overrides]]
filter = 'package(localpilot) and (binary(mesh_conformance) or (binary(mesh_delegate) and test(conformance)))'
test-group = 'mesh-conformance'
